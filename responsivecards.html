<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Cards</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;padding:40px}
.container{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.card{flex:1 1 calc(25% - 20px);background:#fff;padding:40px;text-align:center;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:background .3s ease}
.card:hover{background:#e0f7fa}
@media(max-width:900px){.card{flex:1 1 calc(50% - 20px)}}
@media(max-width:600px){.card{flex:1 1 100%}}
</style>
</head>
<body>
<div class="container">
<div class="card">Card 1</div>
<div class="card">Card 2</div>
<div class="card">Card 3</div>
<div class="card">Card 4</div>
</div>
</body>
</html>
