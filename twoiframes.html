<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iframes Example</title>
</head>
<body>
  <h2>My Webpage with Two Iframes</h2>

  <!-- First iframe: Introduction page -->
  <iframe
    src="intro.html"
    title="My Introduction"
    width="80%"
    height="300"
    style="border:2px solid black; display:block; margin:0 auto 20px auto;">
  </iframe>

  <!-- Second iframe: Hobby page -->
  <iframe
    src="hobby.html"
    title="My Hobby"
    width="80%"
    height="300"
    style="border:2px solid black; display:block; margin:0 auto;">
  </iframe>
</body>
</html>
