<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Flexbox Layout</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4}
header,footer{background:#333;color:#fff;padding:15px 20px}
header{display:flex;justify-content:space-between;align-items:center}
nav a{color:#fff;text-decoration:none;margin-left:15px;font-weight:bold}
main{display:flex;justify-content:space-around;gap:20px;padding:40px}
.box{flex:1;background:#fff;padding:40px;text-align:center;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:transform .3s ease}
.box:hover{transform:scale(1.05)}
footer{text-align:center}
@media(max-width:750px){main{flex-direction:column;align-items:center}}
</style>
</head>
<body>
<header>
<div class="logo">MyLogo</div>
<nav><a href="#">Home</a><a href="#">About</a><a href="#">Services</a><a href="#">Contact</a></nav>
</header>
<main>
<div class="box">Feature 1</div>
<div class="box">Feature 2</div>
<div class="box">Feature 3</div>
</main>
<footer>&copy; 2025 My Website</footer>
</body>
</html>
