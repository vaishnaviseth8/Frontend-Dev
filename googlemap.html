<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Embedded Google Map</title>
</head>
<body>
  <!-- This iframe embeds a Google Map showing New Delhi -->
  <iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d224345.8392450499!2d77.06889924090973!3d28.527582004814708!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390ce26f9a8b2bff%3A0x8f9e0a44e4f6a8ef!2sNew%20Delhi%2C%20Delhi!5e0!3m2!1sen!2sin!4v1696600000000!5m2!1sen!2sin"
    title="Map of New Delhi"
    width="80%"
    height="500"
    style="border:0;"
    allowfullscreen=""
    loading="lazy">
  </iframe>

  <!-- The loading="lazy" attribute delays loading the map until it appears in the viewport, improving page load speed -->
</body>
</html>
