<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Report</title>
</head>
<body>

  <h1>Greenfield High School</h1>

  <table border="1" cellpadding="8" cellspacing="0" title="Student marks report">
    <thead>
      <tr>
        <th rowspan="2" title="Subject names">Subject</th>
        <th colspan="2" title="Marks obtained and maximum marks">Marks</th>
      </tr>
      <tr>
        <th title="Marks obtained by the student">Obtained</th>
        <th title="Maximum possible marks">Max</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Mathematics</td>
        <td>85</td>
        <td>100</td>
      </tr>
      <tr>
        <td>English</td>
        <td>78</td>
        <td>100</td>
      </tr>
      <tr>
        <td>Science</td>
        <td>90</td>
        <td>100</td>
      </tr>
      <tr>
        <td>History</td>
        <td>74</td>
        <td>100</td>
      </tr>
      <tr>
        <td>Geography</td>
        <td>88</td>
        <td>100</td>
      </tr>
      <tr>
        <td colspan="1" title="Total marks obtained and total max marks"><strong>Total</strong></td>
        <td colspan="1"><strong>415</strong></td>
        <td colspan="1"><strong>500</strong></td>
      </tr>
      <tr>
        <td colspan="1" title="Percentage calculated from total marks"><strong>Percentage</strong></td>
        <td colspan="2"><strong>83%</strong></td>
      </tr>
    </tbody>
  </table>

</body>
</html>
