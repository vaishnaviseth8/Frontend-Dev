<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borders and Padding Demo</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f8f8f8;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}
.box {
  width: 180px;
  height: 180px;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: border-color 0.3s;
}
.box1 {
  border: 4px solid #333;
  padding: 10px;
}
.box2 {
  border: 4px dashed #555;
  padding: 20px;
}
.box3 {
  border: 6px double #777;
  padding: 30px;
  border-radius: 15px;
}
.box4 {
  border: 6px groove #999;
  padding: 40px;
  border-radius: 30px;
}
.box:hover {
  border-color: #007bff;
}
</style>
</head>
<body>
<div class="container">
  <div class="box box1">Solid</div>
  <div class="box box2">Dashed</div>
  <div class="box box3">Double</div>
  <div class="box box4">Groove</div>
</div>
</body>
</html>
