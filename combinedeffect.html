<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined Effects Demo</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  flex-wrap: wrap;
}
button {
  padding: 15px 30px;
  font-size: 1rem;
  border: none;
  border-radius: 10px;
  background: #007bff;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  transition: all 0.3s ease;
}
button:hover {
  background: #0056b3;
  transform: scale(1.1);
  box-shadow: 0 6px 15px rgba(0,0,0,0.25);
}
button:active {
  transform: scale(0.98);
  box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}
button:focus {
  outline: 3px solid #80bdff;
  outline-offset: 2px;
}
.secondary {
  background: #28a745;
}
.secondary:hover {
  background: #1e7e34;
}
.danger {
  background: #dc3545;
}
.danger:hover {
  background: #b52a36;
}
</style>
</head>
<body>
<div class="container">
  <button class="primary">Primary</button>
  <button class="secondary">Success</button>
  <button class="danger">Danger</button>
</div>
</body>
</html>
