<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Section</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .pricing-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    padding: 40px;
  }
  .card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    padding: 30px;
    width: 250px;
    text-align: center;
    transition: transform 0.3s, box-shadow 0.3s;
    opacity: 0;
    animation: fadeIn 1s forwards;
  }
  .card:nth-child(1) { animation-delay: 0.2s; }
  .card:nth-child(2) { animation-delay: 0.4s; }
  .card:nth-child(3) { animation-delay: 0.6s; }
  .card:hover {
    transform: translateY(-10px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }
  .highlight {
    background: #007bff;
    color: white;
    transform: scale(1.05);
  }
  .card h3 {
    margin-bottom: 10px;
  }
  .card p {
    font-size: 1.2em;
    margin-bottom: 15px;
  }
  .card button {
    background: #333;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
  }
  .highlight button {
    background: white;
    color: #007bff;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 750px) {
    .pricing-container {
      flex-direction: column;
    }
    .highlight {
      transform: none;
    }
  }
</style>
</head>
<body>
  <div class="pricing-container">
    <div class="card">
      <h3>Basic</h3>
      <p>$9/month</p>
      <button>Choose Plan</button>
    </div>
    <div class="card highlight">
      <h3>Pro</h3>
      <p>$19/month</p>
      <button>Choose Plan</button>
    </div>
    <div class="card">
      <h3>Premium</h3>
      <p>$29/month</p>
      <button>Choose Plan</button>
    </div>
  </div>
</body>
</html>
