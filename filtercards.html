<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filter Cards with Animation</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;padding:40px}
.container{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;animation:fadeIn 1s ease-in}
.card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden;text-align:center;transition:.3s;padding:20px;width:250px}
.card img{width:100%;height:200px;object-fit:cover;filter:sepia(100%);transition:.3s}
.card:hover{transform:translateY(-10px)}
.card:hover img{filter:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:800px){.container{flex-direction:column;align-items:center}}
</style>
</head>
<body>
<div class="container">
<div class="card"><img src="https://picsum.photos/id/1011/400/300"><h3>Jane Doe</h3><p>Web Designer</p></div>
<div class="card"><img src="https://picsum.photos/id/1015/400/300"><h3>John Smith</h3><p>UI/UX Expert</p></div>
<div class="card"><img src="https://picsum.photos/id/1025/400/300"><h3>Emily Rose</h3><p>Frontend Developer</p></div>
</div>
</body>
</html>
