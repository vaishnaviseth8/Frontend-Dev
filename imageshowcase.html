<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Showcase</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  justify-content: center;
  padding: 50px 20px;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  width: 100%;
  max-width: 1000px;
}
figure {
  position: relative;
  margin: 0;
  overflow: hidden;
  border-radius: 15px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.2);
  cursor: pointer;
  transition: transform 0.3s ease;
}
figure img {
  width: 100%;
  display: block;
  border-radius: 15px;
  transition: transform 0.3s ease;
}
figure figcaption {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 10px;
  color: #fff;
  background: rgba(0, 0, 0, 0.5);
  text-align: center;
  font-size: 1em;
  transition: background 0.3s ease;
}
figure:hover img {
  transform: scale(1.1);
}
figure:hover figcaption {
  background: rgba(0, 0, 0, 0.7);
}
@media (max-width: 700px) {
  .gallery {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<div class="gallery">
  <figure>
    <img src="https://via.placeholder.com/300x200" alt="Image 1">
    <figcaption>Caption 1</figcaption>
  </figure>
  <figure>
    <img src="https://via.placeholder.com/300x200" alt="Image 2">
    <figcaption>Caption 2</figcaption>
  </figure>
  <figure>
    <img src="https://via.placeholder.com/300x200" alt="Image 3">
    <figcaption>Caption 3</figcaption>
  </figure>
  <figure>
    <img src="https://via.placeholder.com/300x200" alt="Image 4">
    <figcaption>Caption 4</figcaption>
  </figure>
  <figure>
    <img src="https://via.placeholder.com/300x200" alt="Image 5">
    <figcaption>Caption 5</figcaption>
  </figure>
  <figure>
    <img src="https://via.placeholder.com/300x200" alt="Image 6">
    <figcaption>Caption 6</figcaption>
  </figure>
</div>
</body>
</html>
