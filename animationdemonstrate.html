<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Animation Demo</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f5f5f5;
  flex-direction: column;
  gap: 60px;
}

/* Moving Box */
.box {
  width: 100px;
  height: 100px;
  background: #007bff;
  border-radius: 10px;
  animation: moveBox 3s ease-in-out infinite alternate;
}

/* Bouncing Ball */
.ball {
  width: 50px;
  height: 50px;
  background: #28a745;
  border-radius: 50%;
  animation: bounce 2s ease-in-out infinite;
}

/* Color Changing Text */
.color-text {
  font-size: 2rem;
  font-weight: bold;
  animation: colorChange 4s ease-in-out infinite alternate;
}

/* Keyframes */
@keyframes moveBox {
  0% { transform: translateX(0); }
  100% { transform: translateX(200px); }
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-150px); }
}

@keyframes colorChange {
  0% { color: #e74c3c; }
  25% { color: #f1c40f; }
  50% { color: #2ecc71; }
  75% { color: #3498db; }
  100% { color: #9b59b6; }
}

/* Optional: add delays and different iteration counts */
.box {
  animation-delay: 0s;
  animation-iteration-count: infinite;
  animation-direction: alternate;
}

.ball {
  animation-delay: 0.5s;
  animation-iteration-count: infinite;
  animation-direction: normal;
}

.color-text {
  animation-delay: 1s;
  animation-iteration-count: infinite;
  animation-direction: alternate;
}
</style>
</head>
<body>
<div class="box"></div>
<div class="ball"></div>
<div class="color-text">Animated Text</div>
</body>
</html>
