
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Typography</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;display:flex;justify-content:center;align-items:center;min-height:100vh;text-align:center;padding:40px}
section{max-width:800px}
h1{font-size:clamp(1.5rem,4vw,3rem);margin-bottom:20px}
p{font-size:clamp(1rem,2vw,1.5rem);line-height:1.6;margin:0 auto}
@media(max-width:700px){p{line-height:1.8;margin:10px 0}}
</style>
</head>
<body>
<section>
<h1>Responsive Typography Example</h1>
<p>This paragraph scales smoothly using relative units and the clamp() function, ensuring consistent readability across all devices and screen sizes.</p>
</section>
</body>
</html>
