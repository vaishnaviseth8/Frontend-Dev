<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dropdown Selection Page</title>
</head>
<body>

  <h1>Choose Your Travel Preferences</h1>

  <form>

    <label for="country">Country:</label><br>
    <select id="country" name="country">
      <option value="usa">USA</option>
      <option value="france" selected>France</option>
      <option value="japan">Japan</option>
      <option value="australia">Australia</option>
    </select><br><br>

    <label for="state">State:</label><br>
    <select id="state" name="state">
      <option value="california">California</option>
      <option value="texas" selected>Texas</option>
      <option value="newyork">New York</option>
      <option value="florida">Florida</option>
    </select><br><br>

    <label for="city">City:</label><br>
    <select id="city" name="city">
      <option value="houston" selected>Houston</option>
      <option value="dallas">Dallas</option>
      <option value="austin">Austin</option>
      <option value="sanantonio">San Antonio</option>
    </select><br><br>

    <label for="tourist-place">Favorite Tourist Place:</label><br>
    <select id="tourist-place" name="tourist-place">
      <option value="eiffeltower">Eiffel Tower</option>
      <option value="disneyworld" selected>Disney World</option>
      <option value="greatwall">Great Wall of China</option>
      <option value="sydneyopera">Sydney Opera House</option>
    </select><br><br>

  </form>

  <p>You have selected France as your country, Texas as your state, Houston as your city, and Disney World as your favorite tourist place.</p>

</body>
</html>
