<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Model Exploration</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #f5f5f5;
  flex-direction: column;
  gap: 40px;
}
.container {
  display: flex;
  gap: 60px;
  flex-wrap: wrap;
  justify-content: center;
}
.box-demo {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.box {
  background: #ffe066;
  padding: 20px;
  border: 5px solid #ff6b6b;
  margin: 20px;
  width: 150px;
  height: 100px;
  outline: 2px dashed #1dd1a1;
  transition: all 0.3s;
}
.box:hover {
  transform: scale(1.05);
}
.description {
  text-align: center;
  max-width: 200px;
  margin-top: 10px;
  font-size: 0.95em;
}
.default-box {
  box-sizing: content-box;
}
.border-box {
  box-sizing: border-box;
}
h2 {
  text-align: center;
  margin-bottom: 0;
}
</style>
</head>
<body>

<h2>Box Model Exploration</h2>
<div class="container">
  <div class="box-demo">
    <div class="box default-box">Content-Box</div>
    <div class="description">
      Default <strong>content-box</strong> includes width and height for content only. Padding and border add extra space outside content.
    </div>
  </div>

  <div class="box-demo">
    <div class="box border-box">Border-Box</div>
    <div class="description">
      <strong>border-box</strong> includes padding and border within width and height. Makes sizing easier to manage.
    </div>
  </div>
</div>

</body>
</html>
