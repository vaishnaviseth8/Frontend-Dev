<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2em;
      background-color: #f4f4f4;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 2em;
      font-size: 2.5rem;
      color: #1a1a2e;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5em;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.3s;
    }

    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.3s;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }

    .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 1em;
      background: rgba(0,0,0,0.6);
      color: #fff;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .gallery-item:hover .caption {
      opacity: 1;
    }
  </style>
</head>
<body>

  <h1>Responsive Photo Gallery</h1>

  <div class="gallery">
    <div class="gallery-item">
      <img src="https://via.placeholder.com/300x200?text=Image+1" alt="Image 1">
      <div class="caption">Caption 1</div>
    </div>

    <div class="gallery-item">
      <img src="https://via.placeholder.com/300x200?text=Image+2" alt="Image 2">
      <div class="caption">Caption 2</div>
    </div>

    <div class="gallery-item">
      <img src="https://via.placeholder.com/300x200?text=Image+3" alt="Image 3">
      <div class="caption">Caption 3</div>
    </div>

    <div class="gallery-item">
      <img src="https://via.placeholder.com/300x200?text=Image+4" alt="Image 4">
      <div class="caption">Caption 4</div>
    </div>

    <div class="gallery-item">
      <img src="https://via.placeholder.com/300x200?text=Image+5" alt="Image 5">
      <div class="caption">Caption 5</div>
    </div>

    <div class="gallery-item">
      <img src="https://via.placeholder.com/300x200?text=Image+6" alt="Image 6">
      <div class="caption">Caption 6</div>
    </div>
  </div>

</body>
</html>
