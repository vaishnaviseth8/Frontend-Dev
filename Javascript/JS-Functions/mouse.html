<!DOCTYPE html>
<html>
<head>
<title>Mouse Path & Logger</title>
<style>
  body { font-family: Arial; padding: 20px; }
  #box {
    width: 400px; height: 400px; border: 2px solid #333;
    position: relative; margin-bottom: 10px; background: #f0f0f0;
  }
  #coords { margin-bottom: 15px; font-weight: bold; }
  .dot {
    width: 8px; height: 8px; background: red; border-radius: 50%;
    position: absolute; transform: translate(-50%, -50%);
  }
</style>
</head>
<body>

<h2>Mouse Path & Coordinates Logger</h2>

<div id="box"></div>
<div id="coords">X: 0, Y: 0</div>

<script>
const box = document.getElementById("box");
const coords = document.getElementById("coords");

box.addEventListener("mousemove", (e) => {
  const rect = box.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  coords.textContent = `X: ${x}, Y: ${y}`;
});

box.addEventListener("dblclick", (e) => {
  const rect = box.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const dot = document.createElement("div");
  dot.classList.add("dot");
  dot.style.left = `${x}px`;
  dot.style.top = `${y}px`;
  box.appendChild(dot);
});
</script>

</body>
</html>
