<!DOCTYPE html>
<html>
<head>
<title>Image Gallery with Modal</title>
<style>
  body { font-family: Arial; }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 600px; margin: 20px auto; }
  .gallery img { width: 100%; cursor: pointer; border-radius: 5px; }
  
  .modal {
    display: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); justify-content: center; align-items: center;
  }
  .modal-content {
    position: relative;
    max-width: 80%; max-height: 80%;
  }
  .modal-content img { width: 100%; height: auto; border-radius: 5px; }
</style>
</head>
<body>

<h2 style="text-align:center">Image Gallery</h2>

<div class="gallery">
  <img src="https://via.placeholder.com/150?text=1" alt="Image 1">
  <img src="https://via.placeholder.com/150?text=2" alt="Image 2">
  <img src="https://via.placeholder.com/150?text=3" alt="Image 3">
  <img src="https://via.placeholder.com/150?text=4" alt="Image 4">
  <img src="https://via.placeholder.com/150?text=5" alt="Image 5">
  <img src="https://via.placeholder.com/150?text=6" alt="Image 6">
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <img id="modalImg" src="" alt="Large Preview">
  </div>
</div>

<script>
const galleryImages = document.querySelectorAll(".gallery img");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");

galleryImages.forEach(img => {
  img.addEventListener("click", () => {
    modal.style.display = "flex";
    modalImg.src = img.src.replace("150","600"); // bigger version
  });
});

modal.addEventListener("click", () => {
  modal.style.display = "none";
});

document.querySelector(".modal-content").addEventListener("click", (e) => {
  e.stopPropagation();
});
</script>

</body>
</html>
