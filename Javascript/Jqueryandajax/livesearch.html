<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Product Search</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
  #search { width: 300px; padding: 5px; margin-bottom: 10px; }
  #results { margin-top: 10px; }
  .product { border: 1px solid #ccc; padding: 10px; margin: 5px 0; display: flex; align-items: center; }
  .product img { width: 50px; height: 50px; margin-right: 10px; }
  #loading { display: none; font-style: italic; }
</style>
</head>
<body>

<input type="text" id="search" placeholder="Search products...">
<div id="loading">Loading...</div>
<div id="results"></div>

<script>
  $('#search').on('keyup', function() {
    const query = $(this).val().trim();
    $('#results').empty();
    if(query === '') return;

    $('#loading').show();

    $.ajax({
      url: '/products',
      method: 'GET',
      data: { q: query },
      dataType: 'json',
      success: function(data) {
        $('#loading').hide();
        if(!data || data.length === 0) {
          $('#results').html('<p>No products found</p>');
          return;
        }
        data.forEach(item => {
          const html = `<div class="product">
            <img src="${item.image}" alt="${item.name}">
            <div>
              <p>${item.name}</p>
              <p>$${item.price}</p>
            </div>
          </div>`;
          $('#results').append(html);
        });
      },
      error: function() {
        $('#loading').hide();
        $('#results').html('<p>Error fetching products.</p>');
      }
    });
  });
</script>

</body>
</html>
