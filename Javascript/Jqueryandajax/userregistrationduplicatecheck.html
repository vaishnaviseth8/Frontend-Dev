<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Registration</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
  form { max-width: 300px; margin: 20px; display: flex; flex-direction: column; }
  input, button { margin: 5px 0; padding: 5px; }
  .message { margin-top: 10px; }
</style>
</head>
<body>

<h2>User Registration</h2>
<form id="regForm">
  <input type="text" id="name" placeholder="Name" required>
  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>
  <button type="submit">Register</button>
</form>
<div class="message" id="message"></div>

<script>
const form = document.getElementById('regForm');
const messageDiv = document.getElementById('message');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = form.name.value.trim();
  const email = form.email.value.trim();
  const password = form.password.value.trim();
  messageDiv.textContent = 'Checking email...';

  try {
    const res = await axios.get(`http://localhost:3000/users?email=${email}`);
    if (res.data.length > 0) {
      messageDiv.textContent = 'Email already registered.';
      return;
    }

    await axios.post('http://localhost:3000/users', { name, email, password });
    messageDiv.textContent = 'Registration successful!';
    form.reset();
  } catch {
    messageDiv.textContent = 'Error processing registration.';
  }
});
</script>

</body>
</html>
