<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>College Timetable Viewer</title>
<style>
  table { border-collapse: collapse; width: 50%; margin-top: 10px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
</style>
</head>
<body>

<h2>College Timetable</h2>
<select id="daySelect">
  <option value="Monday">Monday</option>
  <option value="Tuesday">Tuesday</option>
  <option value="Wednesday">Wednesday</option>
  <option value="Thursday">Thursday</option>
  <option value="Friday">Friday</option>
</select>

<div id="timetable"></div>

<script>
const daySelect = document.getElementById('daySelect');
const timetableDiv = document.getElementById('timetable');

async function loadTimetable(day) {
  timetableDiv.innerHTML = 'Loading...';
  try {
    const res = await fetch(`http://localhost:3000/timetable?day=${day}`);
    const data = await res.json();
    if (!data.length) {
      timetableDiv.textContent = 'No classes today.';
      return;
    }
    let html = '<table><tr><th>Subject</th><th>Faculty</th><th>Time</th></tr>';
    data.forEach(cls => {
      html += `<tr><td>${cls.subject}</td><td>${cls.faculty}</td><td>${cls.time}</td></tr>`;
    });
    html += '</table>';
    timetableDiv.innerHTML = html;
  } catch {
    timetableDiv.textContent = 'Failed to load timetable.';
  }
}

daySelect.addEventListener('change', () => loadTimetable(daySelect.value));

loadTimetable(daySelect.value);
</script>

</body>
</html>
