<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .pricing-card {
      transition: all 0.3s ease;
    }
    .pricing-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body class="bg-light text-dark">

  <div class="container py-5">
    <h1 class="text-center fw-bold mb-5">Choose Your Plan</h1>

    <div class="row g-4">
      <!-- Basic Plan -->
      <div class="col-12 col-md-4">
        <div class="card pricing-card h-100 text-center border-0 shadow-sm">
          <div class="card-body">
            <h3 class="card-title fw-bold">Basic</h3>
            <h2 class="my-3">$9<span class="fs-6 text-muted">/mo</span></h2>
            <ul class="list-unstyled mb-4">
              <li>✔ 5 Projects</li>
              <li>✔ 10 GB Storage</li>
              <li>✔ Email Support</li>
            </ul>
            <a href="#" class="btn btn-outline-primary">Get Started</a>
          </div>
        </div>
      </div>

      <!-- Pro Plan (Highlighted) -->
      <div class="col-12 col-md-4">
        <div class="card pricing-card h-100 text-center bg-primary text-white border-0 shadow-sm">
          <div class="card-body">
            <h3 class="card-title fw-bold">Pro</h3>
            <h2 class="my-3">$29<span class="fs-6 text-light">/mo</span></h2>
            <ul class="list-unstyled mb-4">
              <li>✔ 50 Projects</li>
              <li>✔ 100 GB Storage</li>
              <li>✔ Priority Support</li>
            </ul>
            <a href="#" class="btn btn-light text-primary fw-bold">Choose Plan</a>
          </div>
        </div>
      </div>

      <!-- Enterprise Plan -->
      <div class="col-12 col-md-4">
        <div class="card pricing-card h-100 text-center border-0 shadow-sm">
          <div class="card-body">
            <h3 class="card-title fw-bold">Enterprise</h3>
            <h2 class="my-3">$99<span class="fs-6 text-muted">/mo</span></h2>
            <ul class="list-unstyled mb-4">
              <li>✔ Unlimited Projects</li>
              <li>✔ 1 TB Storage</li>
              <li>✔ 24/7 Dedicated Support</li>
            </ul>
            <a href="#" class="btn btn-outline-primary">Contact Sales</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
