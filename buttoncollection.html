<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Styled Button Collection</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #f5f5f5;
}
.button-container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
  align-items: center;
}

/* Primary Button */
button.primary {
  padding: 12px 25px;
  background: #007bff;
  color: #fff;
  border: none;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  cursor: pointer;
  transition: all 0.3s ease;
}
button.primary:hover {
  background: #0056b3;
  transform: translateY(-2px);
}
button.primary:active {
  transform: translateY(1px);
}
button.primary:focus {
  outline: 3px solid #80bdff;
  outline-offset: 2px;
}

/* Secondary Button */
button.secondary {
  padding: 12px 25px;
  background: #6c757d;
  color: #fff;
  border: none;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  cursor: pointer;
  transition: all 0.3s ease;
}
button.secondary:hover {
  background: #5a6268;
  transform: translateY(-2px);
}
button.secondary:active {
  transform: translateY(1px);
}
button.secondary:focus {
  outline: 3px solid #adb5bd;
  outline-offset: 2px;
}

/* Outline Button */
button.outline {
  padding: 12px 25px;
  background: transparent;
  color: #007bff;
  border: 2px solid #007bff;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
}
button.outline:hover {
  background: #007bff;
  color: #fff;
  transform: translateY(-2px);
}
button.outline:active {
  transform: translateY(1px);
}
button.outline:focus {
  outline: 3px solid #80bdff;
  outline-offset: 2px;
}

/* Disabled Button */
button:disabled {
  background: #ccc;
  color: #666;
  border: none;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}
</style>
</head>
<body>
<div class="button-container">
  <button class="primary">Primary</button>
  <button class="secondary">Secondary</button>
  <button class="outline">Outline</button>
  <button disabled>Disabled</button>
</div>
</body>
</html>
