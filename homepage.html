<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3-Section Homepage</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background: #333;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-around;
    align-items: center;
  }

  header a {
    color: white;
    text-decoration: none;
    font-weight: bold;
  }

  main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 40px;
    flex-wrap: wrap;
  }

  .box {
    background: #007bff;
    color: white;
    width: 200px;
    height: 200px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
    font-size: 1.2em;
    transition: transform 0.3s ease;
  }

  .box:hover {
    transform: rotate(2deg);
  }

  footer {
    background: #333;
    color: white;
    text-align: center;
    padding: 15px;
  }

  @media (max-width: 700px) {
    main {
      flex-direction: column;
    }
  }
</style>
</head>
<body>
  <header>
    <a href="#">Home</a>
    <a href="#">Services</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
  </header>

  <main>
    <div class="box">Services</div>
    <div class="box">Projects</div>
    <div class="box">Contact</div>
  </main>

  <footer>
    &copy; 2025 My Website
  </footer>
</body>
</html>
