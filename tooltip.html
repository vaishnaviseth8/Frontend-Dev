<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip Demo</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  display: flex;
  gap: 40px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
}
.tooltip {
  position: relative;
  display: inline-block;
  cursor: pointer;
  padding: 10px 20px;
  background: #007bff;
  color: #fff;
  border-radius: 5px;
  font-weight: bold;
  transition: transform 0.2s ease;
}
.tooltip:hover {
  transform: scale(1.1);
}
.tooltip span {
  visibility: hidden;
  opacity: 0;
  width: max-content;
  background-color: #333;
  color: #fff;
  text-align: center;
  border-radius: 5px;
  padding: 6px 10px;
  position: absolute;
  bottom: 125%; 
  left: 50%;
  transform: translateX(-50%);
  transition: opacity 0.3s ease-in-out;
  z-index: 1;
  white-space: nowrap;
}
.tooltip span::after {
  content: "";
  position: absolute;
  top: 100%; 
  left: 50%;
  transform: translateX(-50%);
  border-width: 5px;
  border-style: solid;
  border-color: #333 transparent transparent transparent;
}
.tooltip:hover span {
  visibility: visible;
  opacity: 1;
}
</style>
</head>
<body>
<div class="container">
  <div class="tooltip">Home
    <span>Go to homepage</span>
  </div>
  <div class="tooltip">Profile
    <span>View your profile</span>
  </div>
  <div class="tooltip">Settings
    <span>Adjust your settings</span>
  </div>
  <div class="tooltip">Help
    <span>Get assistance</span>
  </div>
</div>
</body>
</html>
