<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="text-center fw-bold mb-4">User Notifications</h1>

    <div class="card shadow-sm">
      <div class="card-body">

        <!-- Alerts -->
        <div class="alert alert-success mb-3" role="alert">
          <strong>Success!</strong> You have 3 new messages in your inbox.
        </div>

        <div class="alert alert-info mb-3" role="alert">
          <strong>Tip:</strong> Complete your profile to unlock more features.
        </div>

        <div class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
          <strong>Warning!</strong> Your subscription will expire in 2 days.
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Summary Well -->
        <div class="bg-light border rounded p-4">
          <h5 class="fw-bold mb-3">Summary</h5>
          <p class="mb-1"><strong>Messages:</strong> 3 new, 5 unread</p>
          <p class="mb-1"><strong>Tips Completed:</strong> 2 out of 5</p>
          <p class="mb-0"><strong>Subscription Status:</strong> Active (Expiring soon)</p>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
