<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotations Example</title>
</head>
<body>
  <h2>Quotations Example</h2>

  <p>
    This is a paragraph with a short quotation: 
    <q>Learning HTML &amp; CSS is fun!</q>
  </p>

  <blockquote>
    "The journey of a thousand miles begins with a single step. 
    Always remember that every challenge &lt;big or small&gt; is an opportunity 
    to grow and learn new things."
  </blockquote>
</body>
</html>
