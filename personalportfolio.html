<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaishnavi Seth Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body, html {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #1a1a2e;
      color: #f0f0f0;
      padding: 1rem 2%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    header nav a {
      color: #f0f0f0;
      text-decoration: none;
      margin-left: 1.5em;
      font-size: 1rem;
    }

    header nav a:hover {
      text-decoration: underline;
    }

    main {
      flex: 1;
      margin-top: 100px;
      padding: 2%;
      background-color: #e0e0e0;
      color: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 70vh;
    }

    main img {
      width: 15em;
      height: auto;
      border-radius: 50%;
      margin-bottom: 2vh;
    }

    main p {
      font-size: 1.2rem;
      max-width: 60%;
      line-height: 1.6em;
    }

    footer {
      background-color: #1a1a2e;
      color: #f0f0f0;
      padding: 1em 2%;
      text-align: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Vaishnavi Seth</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <img src="https://via.placeholder.com/250" alt="Profile Image">
    <p>
      Hello! I am Vaishnavi Seth, a passionate web developer and designer. I enjoy creating responsive, user-friendly web applications
      and exploring new technologies in web development. Welcome to my personal portfolio!
    </p>
  </main>

  <footer>
    &copy; 2025 Vaishnavi Seth. All rights reserved.
  </footer>

</body>
</html>
