<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini User Interface Layout</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e3f2fd, #bbdefb);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
header, footer {
  background: #0d6efd;
  color: #fff;
  text-align: center;
  padding: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px;
}
.card {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  padding: 30px;
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}
.card img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 3px solid #0d6efd;
}
form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 15px;
}
input, select {
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  transition: all 0.3s ease;
}
input:focus, select:focus {
  border-color: #0d6efd;
  box-shadow: 0 0 6px rgba(13,110,253,0.4);
  outline: none;
}
button {
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #0d6efd;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
button:hover {
  background: #0b5ed7;
  transform: scale(1.05);
}
button:active {
  transform: scale(0.98);
}
footer {
  font-size: 0.9em;
}
@media (max-width: 600px) {
  .card {
    width: 90%;
    padding: 20px;
  }
}
</style>
</head>
<body>
<header>
  <h1>Mini UI Layout</h1>
</header>
<main>
  <div class="card">
    <img src="https://via.placeholder.com/100" alt="Profile">
    <form>
      <input type="text" placeholder="Enter your name" required>
      <select>
        <option value="">Select role</option>
        <option>Designer</option>
        <option>Developer</option>
        <option>Manager</option>
      </select>
      <button type="submit">Submit</button>
    </form>
  </div>
</main>
<footer>
  © 2025 Mini UI Example. All rights reserved.
</footer>
</body>
</html>
