<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .product-card {
      transition: all 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="text-center mb-5 fw-bold">Our Products</h1>

    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm border-0">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 1">
          <div class="card-body text-center">
            <h5 class="card-title">Product One</h5>
            <p class="card-text text-muted">$25.00</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm border-0">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 2">
          <div class="card-body text-center">
            <h5 class="card-title">Product Two</h5>
            <p class="card-text text-muted">$30.00</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm border-0">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 3">
          <div class="card-body text-center">
            <h5 class="card-title">Product Three</h5>
            <p class="card-text text-muted">$40.00</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm border-0">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 4">
          <div class="card-body text-center">
            <h5 class="card-title">Product Four</h5>
            <p class="card-text text-muted">$35.00</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
