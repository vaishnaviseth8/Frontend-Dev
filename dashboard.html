<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Layout</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: grid;
    grid-template-columns: 1fr 4fr;
    grid-template-rows: 80px auto;
    grid-template-areas:
      "header header"
      "sidebar main";
    gap: 20px;
  }
  header {
    grid-area: header;
    background: #333;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5em;
  }
  aside {
    grid-area: sidebar;
    background: #444;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
  }
  aside a {
    color: white;
    text-decoration: none;
    margin: 10px 0;
  }
  main {
    grid-area: main;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 20px;
    padding: 20px;
    background: #f4f4f4;
  }
  .box {
    background: white;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2em;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .box:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
  }
  .wide {
    grid-column: span 2;
  }
  @media (max-width: 900px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: 80px auto auto;
      grid-template-areas:
        "header"
        "sidebar"
        "main";
    }
    main {
      grid-template-columns: 1fr;
    }
    .wide {
      grid-column: span 1;
    }
  }
</style>
</head>
<body>
  <header>Dashboard Header</header>
  <aside>
    <a href="#">Overview</a>
    <a href="#">Reports</a>
    <a href="#">Analytics</a>
    <a href="#">Settings</a>
  </aside>
  <main>
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box wide">Wide Box (Spans 2 Columns)</div>
    <div class="box">Box 4</div>
  </main>
</body>
</html>
